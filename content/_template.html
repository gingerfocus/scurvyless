<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="generator" content="pandoc" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <meta name="author" content="gingerfocus" />
    <meta name="description" content="; DROP TABLE bookmarks;" />
    <link href="/style.css" rel="stylesheet" />
    <link href="/print.css" media="print" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>$pagetitle$</title>
  </head>
  <body data-barba="wrapper">
    <header>
      <nav class="banner-line banner-links">
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
        <!-- <a href="/fict">Fiction</a> -->
        <!-- <a href="/resh">Research</a> -->
        <!-- <a href="/metro">Metro</a> -->
        <a href="https://github.com/gingerfocus/scurvyless">Source</a>
      </nav>
    </header>

    <main data-barba="container" data-barba-namespace="home">
      $if(publish)$

      <h1 class="title">$title$</h1>
      <div class="banner-line">
        $if(date)$ <em>Published $date$</em>$endif$ $if(edit)$
        <em>Edited $edit$</em>$endif$ $if(author)$ <em> By $author$</em> $endif$
      </div>
      $body$
      <hr />
      $else$
      <strong>Document not ready set to publish.</strong>
      <a href="/">Go Home</a>
      $endif$
    </main>

    <footer>
      <div class="audio-player">
        <div id="player-controls">
          <button id="music-prev-btn" aria-label="Previous">PREV</button>
          <button id="music-togg-btn" aria-label="Play/Pause">PLAY</button>
          <button id="music-next-btn" aria-label="Skip">NEXT</button>
          <button id="music-copy-btn" aria-label="Copy">COPY</button>
        </div>
        <audio id="main-audio" hidden></audio>
      </div>
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.3/dist/barba.umd.js"
      ></script>
      <script defer src="/dev/music.js"></script>
      <link rel="stylesheet" type="text/css" href="/dev/music.css" />
    </footer>
  </body>
</html>
