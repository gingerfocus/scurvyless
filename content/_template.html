<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="generator" content="pandoc" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <meta name="author" content="gingerfocus" />
    <meta name="description" content="; DROP TABLE bookmarks;" />
    <link rel="icon" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/vsalvino/computer-modern@main/fonts/typewriter.css"
      media="print"
      rel="stylesheet"
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <title>$pagetitle$</title>

    <style>
      :root {
        --bg-color: #1a170f;
        --fg-color: #eceae5;
        --ac-color: #c77638; /* #eec35e; #673680; */
      }

      body {
        background-color: var(--bg-color);
        color: var(--fg-color);
        line-height: 1.2;
        font-size: 0.95rem;
        padding: 20px;
        max-width: 800px;
        font-family: "PT Serif", serif;
      }

      pre {
        font-family: "Fira Code", monospace;
        border-width: 1px;
        border-color: var(--ac-color);
        border-style: solid;
        padding: 5px;
        background-color: #10100a;
        overflow: hidden;
        text-align: center;
      }

      a {
        color: var(--ac-color);
        text-decoration: none;
      }

      h2 {
        margin: 10px;
      }

      .title {
        padding: 5px;
        font-size: 1.4rem;
        background-color: var(--ac-color);
        color: var(--bg-color);
      }

      .banner-line {
        display: flex;
        align-items: center;
        justify-content: space-around;
      }

      @media print {
        body {
          line-height: 1.1;
          font-size: 10pt;
          font-family: "Computer Modern Typewriter", monospace;
          color: #000 !important;
          background: #fff !important;
        }

        header,
        footer {
          display: none !important;
        }

        .title {
          background-color: #fff !important;
        }
        a {
          color: #000 !important;
        }

        p {
          margin: 0;
          text-indent: 2em;
          orphans: 3;
          widows: 3;
        }

        h1,
        h2,
        h3,
        h4,
        h5 {
          font-size: 10pt !important;
          margin: 1em 0 0 0;
          padding: 0;
          page-break-after: avoid;
        }

        h1 {
          border-bottom: 0.5pt solid black;
          margin-bottom: 1em;
          display: block;
        }

        h2 {
          font-weight: bold;
        }

        h3,
        h4,
        h5 {
          font-style: italic;
        }
      }
    </style>
  </head>
  <body data-barba="wrapper">
    <header>
      <nav class="banner-line banner-links">
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
        <!-- <a href="/fict">Fiction</a> -->
        <!-- <a href="/resh">Research</a> -->
        <!-- <a href="/metro">Metro</a> -->
        <a href="https://github.com/gingerfocus/scurvyless">Source</a>
      </nav>
    </header>

    <main data-barba="container" data-barba-namespace="home">
      $if(publish)$

      <h1 class="title">$title$</h1>
      <div class="banner-line">
        $if(date)$ <em>Published $date$</em>$endif$ $if(edit)$
        <em>Edited $edit$</em>$endif$ $if(author)$ <em> By $author$</em> $endif$
      </div>
      $body$
      <hr />
      $else$
      <strong>Document not ready set to publish.</strong>
      <a href="/">Go Home</a>
      $endif$
    </main>

    <footer>
      <div class="audio-player">
        <div id="player-controls">
          <button id="prev-btn" aria-label="Previous">PREV</button>
          <button id="play-pause-btn" aria-label="Play/Pause">PLAY</button>
          <button id="next-btn" aria-label="Skip">NEXT</button>
          <button id="copy-btn" aria-label="Copy">COPY</button>
        </div>
        <audio id="main-audio" hidden></audio>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.3/dist/barba.umd.js"></script>
      <script src="/dev/music.js"></script>
      <link rel="stylesheet" type="text/css" href="/dev/music.css" />
    </footer>
  </body>
</html>
